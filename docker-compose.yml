services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PRAKTIKA_DB: /app/data/praktika.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - praktika_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      PRAKTIKA_DB: /app/data/praktika.sqlite3
      PRAKTIKA_UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - portal_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  praktika_data:
  portal_data:
